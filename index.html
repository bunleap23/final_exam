<!DOCTYPE html>
<html lang="km">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>គណនាថ្លៃផ្ញើរយានជំនិះ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Kantumruy Pro', sans-serif;
      background-color: #1e3a5f;
      min-height: 100vh;
    }
  </style>
</head>

<body class="d-flex align-items-center py-4">

  <div class="container">
    <div class="row g-4 justify-content-center">

      <div class="col-md-6 col-lg-5">
        <div class="card shadow rounded-4 border-0 h-100">
          <div class="card-body p-4">
            <h4 class="text-center fw-bold pb-3 mb-4 border-bottom">គណនាថ្លៃផ្ញើរយានជំនិះ</h4>

            <div class="row mb-3 align-items-center">
              <label for="vehicle" class="col-5 col-form-label">ជ្រើសរើស យានជំនិះ</label>
              <div class="col-7">
                <select id="vehicle" class="form-select">
                  <option value="car">ឡាន</option>
                  <option value="moto">ម៉ូតូ</option>
                </select>
              </div>
            </div>

            <div class="row mb-3 align-items-center">
              <label for="timeIn" class="col-5 col-form-label">ម៉ោងចូល</label>
              <div class="col-7">
                <input type="time" id="timeIn" class="form-control">
              </div>
            </div>

            <div class="row mb-3 align-items-center">
              <label for="timeOut" class="col-5 col-form-label">ម៉ោងចេញ</label>
              <div class="col-7">
                <input type="time" id="timeOut" class="form-control">
              </div>
            </div>

            <div class="row mb-3 align-items-center">
              <label for="riel" class="col-5 col-form-label">ថ្លៃផ្ញើរ រៀល</label>
              <div class="col-7">
                <div class="input-group">
                  <input type="text" id="riel" class="form-control bg-light fw-bold" readonly placeholder="0">
                  <span class="input-group-text fw-bold">៛</span>
                </div>
              </div>
            </div>

            <div class="row mb-4 align-items-center">
              <label for="dollar" class="col-5 col-form-label">ថ្លៃផ្ញើរ ដុល្លា</label>
              <div class="col-7">
                <div class="input-group">
                  <input type="text" id="dollar" class="form-control bg-light fw-bold" readonly placeholder="0.00">
                  <span class="input-group-text fw-bold">$</span>
                </div>
              </div>
            </div>

            <button onclick="calculateParking()" class="btn btn-danger w-100 py-2 fw-bold">គណនា</button>
          </div>
        </div>
      </div>

      <div class="col-md-6 col-lg-5">
        <div class="card shadow rounded-4 border-0 h-100">
          <div class="card-body p-4 d-flex flex-column justify-content-center">
            <h4 class="text-center fw-bold pb-3 mb-4 border-bottom">តារាងតម្លៃផ្ញើរ</h4>

            <div class="mb-4">
              <h5 class="fw-bold">ឡាន</h5>
              <p class="ms-3 mb-1">+ ប្រសិនបើផ្ញើរ 8h &rArr; 1h = 500៛</p>
              <p class="ms-3 mb-0">+ តែបើលើស 8h &rArr; 1h = 1000៛</p>
            </div>

            <div>
              <h5 class="fw-bold">ម៉ូតូ</h5>
              <p class="ms-3 mb-1">+ ប្រសិនបើផ្ញើរ 8h &rArr; 1h = 200៛</p>
              <p class="ms-3 mb-0">+ តែបើលើស 8h &rArr; 1h = 300៛</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function calculateParking() {
      var vehicle = document.getElementById("vehicle").value;
      var timeIn = document.getElementById("timeIn").value;
      var timeOut = document.getElementById("timeOut").value;
      var exchangeRate = 4000;

      if (timeIn === "" || timeOut === "") {
        alert("សូមជ្រើសរើស ម៉ោងចូល និង ម៉ោងចេញ ជាមុនសិន!");
        return;
      }

      var inParts = timeIn.split(":");
      var outParts = timeOut.split(":");

      var startMinutes = parseInt(inParts[0]) * 60 + parseInt(inParts[1]);
      var endMinutes = parseInt(outParts[0]) * 60 + parseInt(outParts[1]);

      if (endMinutes < startMinutes) {
        endMinutes += 24 * 60;
      }

      var totalHours = (endMinutes - startMinutes) / 60;
      var totalRiel = 0;

      if (vehicle === "car") {
        if (totalHours <= 8) {
          totalRiel = totalHours * 500;
        } else {
          totalRiel = totalHours * 1000;
        }
      } else if (vehicle === "moto") {
        if (totalHours <= 8) {
          totalRiel = totalHours * 200;
        } else {
          totalRiel = totalHours * 300;
        }
      }

      var totalDollar = totalRiel / exchangeRate;

      document.getElementById("riel").value = Math.round(totalRiel);
      document.getElementById("dollar").value = totalDollar.toFixed(2);
    }
  </script>

</body>

</html>
